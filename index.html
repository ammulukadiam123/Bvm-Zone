<!DOCTYPE html>
<html>
<head>
  <title>BVM Zone</title>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: Arial; padding:20px; }
    input { margin:5px; padding:8px; }
    button { padding:8px 12px; margin:5px; }
    .product { border:1px solid #ccc; padding:10px; margin:10px; }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <h2>Admin Login</h2>
  <input type="text" id="user" placeholder="Username"><br>
  <input type="password" id="pass" placeholder="Password"><br>
  <button onclick="login()">Login</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" style="display:none;">
  <h2>Add Product</h2>
  <input type="text" id="name" placeholder="Product Name">
  <input type="text" id="price" placeholder="Price">
  <input type="text" id="image" placeholder="Image URL">
  <button onclick="saveProduct()">Save Product</button>
</div>

<hr>

<h2>Products</h2>
<div id="productList"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBKPSTLN_7zU5RjhoiwhRHFyeFDRGce93o",
  authDomain: "bvm-fashion.firebaseapp.com",
  projectId: "bvm-fashion",
  storageBucket: "bvm-fashion.firebasestorage.app",
  messagingSenderId: "165726059118",
  appId: "1:165726059118:web:13d89893501eca90b1847f"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const WA = '918179302897';

// LOGIN
const USERNAME = "admin";
const PASSWORD = "1234";

function login(){
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  if(u === USERNAME && p === PASSWORD){
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";
  } else {
    alert("Wrong login ❌");
  }
}

// SAVE PRODUCT
async function saveProduct(){
  let name = document.getElementById('name').value;
  let price = document.getElementById('price').value;
  let image = document.getElementById('image').value;

  if(!name || !price || !image){
    alert("Fill all fields");
    return;
  }

  await db.collection("products").add({
    name: name,
    price: price,
    image: image
  });

  alert("Saved ✅");
  loadProducts();
  clearForm();
}

// LOAD PRODUCTS
function loadProducts(){
  let list = document.getElementById("productList");
  list.innerHTML = "";

  db.collection("products").get().then((data)=>{
    data.forEach(doc=>{
      let p = doc.data();

      list.innerHTML += `
        <div class="product">
          <img src="${p.image}" style="width:100%;height:180px;object-fit:cover">
          <h3>${p.name}</h3>
          <p>₹${p.price}</p>
          <a href="https://wa.me/${WA}?text=${encodeURIComponent('I want ' + p.name)}">
            <button>Order on WhatsApp</button>
          </a>
        </div>
      `;
    });
  });
}

// CLEAR FORM
function clearForm(){
  document.getElementById('name').value = "";
  document.getElementById('price').value = "";
  document.getElementById('image').value = "";
}

// LOAD ON START
loadProducts();

</script>

</body>
</html>
