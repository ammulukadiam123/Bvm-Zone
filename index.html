<!DOCTYPE html><html>
<head>
  <title>BVM Zone</title>  <!-- Firebase -->  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>  <style>
    body { font-family: Arial; margin:0; }
    .header { background:black; color:white; padding:15px; text-align:center; }
    .container { padding:15px; }
    input { width:100%; padding:10px; margin:5px 0; }
    button { padding:8px; margin:5px; }
    .product { border:1px solid #ccc; padding:10px; margin:10px 0; }
  </style></head><body><div class="header">BVM Zone 🔥</div><!-- POSTER --><div style="background:url('https://i.ibb.co/67v7wXDT/GREEN-2.jpg') center/cover no-repeat;height:180px;display:flex;align-items:center;justify-content:center;color:white;font-size:24px;">
  Welcome to BVM Zone 👕
</div><!-- SEARCH --><div class="container">
  <input type="text" id="search" placeholder="Search products..." onkeyup="loadProducts()">
</div><!-- LOGIN --><div id="loginBox" style="display:none;" class="container">
  <h3>Admin Login</h3>
  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div><!-- ADMIN PANEL --><div id="adminPanel" style="display:none;" class="container">
  <h3>Add / Edit Product</h3>
  <input id="name" placeholder="Product Name">
  <input id="price" placeholder="Price">
  <input id="image" placeholder="Image URL">
  <input id="category" placeholder="Category">
  <input id="sizes" placeholder="Sizes (S,M,L,XL,XXL)">
  <input id="colors" placeholder="Colors (Red,Blue,white,black,pink)">
  <button onclick="saveProduct()">Save</button>
</div><!-- PRODUCTS --><div class="container">
  <h2>Products</h2>
  <div id="productList"></div>
</div><script>
const firebaseConfig = {
  apiKey: "AIzaSyBKPSTLN_7zU5RjhoiwhRHFyeFDRGce93o",
  authDomain: "bvm-fashion.firebaseapp.com",
  projectId: "bvm-fashion",
  storageBucket: "bvm-fashion.firebasestorage.app",
  messagingSenderId: "165726059118",
  appId: "1:165726059118:web:13d89893501eca90b1847f"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const WA = "919848978410";
let isAdmin = false;
let editId = null;

if(window.location.hash === "#admin"){
  loginBox.style.display = "block";
}

function login(){
  if(user.value === "bvm" && pass.value === "1624"){
    isAdmin = true;
    loginBox.style.display = "none";
    adminPanel.style.display = "block";
    loadProducts();
  } else {
    alert("Wrong login");
  }
}

async function saveProduct(){
  let nameVal = document.getElementById("name").value.trim();
  let priceVal = document.getElementById("price").value.trim();
  let imageVal = document.getElementById("image").value.trim();
  let categoryVal = document.getElementById("category").value;
  let sizesVal = document.getElementById("sizes").value;
  let colorsVal = document.getElementById("colors").value;

  if(nameVal === "" || priceVal === "" || imageVal === ""){
    alert("Enter Name, Price, Image");
    return;
  }

  let data = {
    name: nameVal,
    price: priceVal,
    image: imageVal,
    category: categoryVal,
    sizes: sizesVal,
    colors: colorsVal,
    hidden: false
  };

  try{
    if(editId){
      await db.collection("products").doc(editId).update(data);
      editId = null;
    } else {
      await db.collection("products").add(data);
    }

    alert("Saved ✅");
    loadProducts();

  } catch(e){
    alert("Error: " + e.message);
  }
}

async function deleteProduct(id){
  if(confirm("Delete product?")){
    await db.collection("products").doc(id).delete();
    loadProducts();
  }
}

function editProduct(id,nameVal,priceVal,imageVal,catVal,sizeVal,colorVal){
  name.value = nameVal;
  price.value = priceVal;
  image.value = imageVal;
  category.value = catVal;
  sizes.value = sizeVal;
  colors.value = colorVal;
  editId = id;
}

async function toggleHide(id,current){
  await db.collection("products").doc(id).update({hidden: !current});
  loadProducts();
}

function loadProducts(){
  let list = document.getElementById("productList");
  list.innerHTML = "";

  let search = document.getElementById("search").value.toLowerCase();

  db.collection("products").get().then(res=>{
    res.forEach(doc=>{
      let p = doc.data();

      if(p.hidden && !isAdmin) return;

      if(search && !p.name.toLowerCase().includes(search) && !p.category.toLowerCase().includes(search)) return;

      list.innerHTML += `
        <div class="product">
          <img src="${p.image}" style="width:100%;height:auto;max-height:200px;object-fit:contain;display:block;margin:auto;">
          <h3>${p.name}</h3>
          <p>₹${p.price}</p>
          <p><b>${p.category || ''}</b></p>
          <select id="size-${doc.id}">
  ${(p.sizes || "").split(",").map(s => `<option>${s}</option>`).join("")}
</select>

<select id="color-${doc.id}">
  ${(p.colors || "").split(",").map(c => `<option>${c}</option>`).join("")}
</select>

          <a href="#" onclick="orderNow('${doc.id}','${p.name}','${p.price}','${p.image}')">
  <button>Order on WhatsApp</button>
</a>

          ${isAdmin ? `
            <br>
            <button onclick="editProduct('${doc.id}','${p.name}','${p.price}','${p.image}','${p.category || ''}','${p.sizes || ''}','${p.colors || ''}')">Edit</button>
            <button onclick="deleteProduct('${doc.id}')">Delete</button>
            <button onclick="toggleHide('${doc.id}', ${p.hidden})">${p.hidden ? 'Unhide' : 'Hide'}</button>
          ` : ''}
        </div>
      `;
    });
  });
}

loadProducts();
function orderNow(id,name,price,image){
  let size = document.getElementById("size-"+id)?.value || "";
  let color = document.getElementById("color-"+id)?.value || "";

  let msg = `I want ${name}
Price: ₹${price}
Size: ${size}
Color: ${color}
Image: ${image}`;

  window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`);
}
</script></body>
</html>
